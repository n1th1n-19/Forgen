name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them accumulate into noise
  # nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  # The engine crates carry no GTK dependency by design, so they build and test
  # without a display server or any system development packages. Keeping this
  # job separate means a UI toolchain problem never masks a git-engine failure.
  engine:
    name: engine (git, auth, db, github)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p git -p auth -p db -p github --all-targets

      - name: Test
        run: cargo test -p git -p auth -p db -p github

  # The memory budget is forqen's differentiating claim. A claim nobody
  # measures rots within a sprint, so it gates every pull request.
  memcheck:
    name: memory budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Scroll a 20k-commit history under budget
        run: cargo test -p git --test memcheck --release -- --nocapture

  ui:
    name: ui + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p ui -p app --all-targets

      - name: Build
        run: cargo build --workspace

  # Packaging validation, deliberately not on every push.
  #
  # A Flatpak build downloads ~1GB of GNOME SDK and compiles the whole
  # dependency tree inside the sandbox — several minutes and a lot of bandwidth
  # to re-prove something that only changes when the manifest does. Runs on
  # tags and on demand.
  #
  # No container image: bilelmoussaoui/flatpak-github-actions publishes tags up
  # to gnome-47, and this manifest targets runtime 50, so flatpak is installed
  # on the runner instead and the SDK comes from flathub.
  flatpak:
    name: flatpak
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: dtolnay/rust-toolchain@stable

      # vendor/ is gitignored — 437MB has no business in the repository — so it
      # is regenerated here. The build sandbox has no network, so without this
      # cargo cannot resolve a single dependency.
      - name: Vendor crates for the offline sandbox
        run: cargo vendor --versioned-dirs vendor

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            build build-aux/io.github.forqen.Forqen.yml
