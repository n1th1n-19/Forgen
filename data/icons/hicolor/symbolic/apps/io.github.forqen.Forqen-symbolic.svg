<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic variant: 16px grid, single colour, recoloured by the theme at
  runtime. Must stay one flat path set with no opacity — symbolic icons are
  masked, so anything semi-transparent renders as a smudge.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M5 2.5 V13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M5 5.5 C5 4, 11 4, 11 5.5 V7.5 C11 9, 5 9, 5 10.5"
        stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
  <circle cx="5" cy="3" r="1.6" fill="currentColor"/>
  <circle cx="5" cy="8" r="1.6" fill="currentColor"/>
  <circle cx="5" cy="13" r="1.6" fill="currentColor"/>
  <circle cx="11" cy="6.5" r="1.6" fill="currentColor"/>
</svg>
