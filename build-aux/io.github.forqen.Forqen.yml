# Flatpak manifest.
#
# Built in R0 rather than deferred to a packaging phase, because the sandbox
# holes below are architectural. Discovering in month six that push cannot
# reach ssh-agent, or that the keyring is unreachable, means redoing auth —
# not adding a manifest line.
id: io.github.forqen.Forqen
runtime: org.gnome.Platform
# Tracks the current GNOME runtime. Bumping this is not free — each branch is a
# separate ~1GB runtime download for every user — so it moves deliberately,
# not with every GNOME release.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: forqen

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/forqen/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network

  # Repositories live anywhere under $HOME.
  - --filesystem=home

  # Push over SSH. Without this the agent socket is invisible inside the
  # sandbox and every SSH remote fails with a permission error that looks like
  # a credentials problem rather than a sandbox one.
  - --socket=ssh-auth

  # Token storage. forqen refuses to write tokens to disk in plaintext, so with
  # no Secret Service reachable it cannot log in at all.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-run/keyring

  # git config, global gitignore, and commit signing keys.
  - --filesystem=xdg-config/git:ro
  - --filesystem=~/.gitconfig:ro

  # GPG signing needs the agent; SSH signing goes through the socket above.
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=~/.gnupg:ro

  # See the .desktop file: glibc reads this before main() runs.
  - --env=MALLOC_ARENA_MAX=2

modules:
  # git itself is not in org.gnome.Platform, and forqen shells out to it for
  # rebase, signed commits, hooks, LFS and push negotiation. Bundling it also
  # pins the version the differential tests were written against.
  - name: git
    buildsystem: autotools
    make-args:
      - NO_TCLTK=1
      - NO_GETTEXT=1
    make-install-args:
      - NO_TCLTK=1
      - NO_GETTEXT=1
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.47.1.tar.xz
        # Verified against the kernel.org tarball with sha256sum on 2026-08-16.
        # If this ever mismatches, the build fails loudly — that is correct.
        # Do not "fix" a mismatch by deleting the hash.
        sha256: f3d8f9bb23ae392374e91cd9d395970dabc5b9c5ee72f39884613cd84a6ed310
    cleanup:
      - /libexec/git-core/git-cvs*
      - /libexec/git-core/git-svn*
      - /share/man

  - name: forqen
    buildsystem: meson
    config-opts:
      - -Dprofile=release
    sources:
      - type: dir
        path: ..
    # Vendored so the build is offline, which flathub requires.
    # Regenerate with: cargo vendor && tar czf cargo-vendor.tar.gz vendor
    # build-options:
    #   env:
    #     CARGO_NET_OFFLINE: 'true'
