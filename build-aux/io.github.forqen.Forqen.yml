# Flatpak manifest.
#
# Built in R0 rather than deferred to a packaging phase, because the sandbox
# holes below are architectural. Discovering in month six that push cannot
# reach ssh-agent, or that the keyring is unreachable, means redoing auth —
# not adding a manifest line.
id: io.github.forqen.Forqen
runtime: org.gnome.Platform
# Tracks the current GNOME runtime. Bumping this is not free — each branch is a
# separate ~1GB runtime download for every user — so it moves deliberately,
# not with every GNOME release.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: forqen

# Skip flatpak-builder's AppStream catalog generation.
#
# `appstreamcli compose` loads icons through glycin, which spawns a nested
# sandbox via flatpak-spawn — and that cannot start inside flatpak-builder's
# own sandbox. It fails identically on SVG and PNG:
#
#   file-read-error: Loader process exited early with status '1'
#   Command: ... flatpak-spawn --sandbox ... glycin-image-rs
#
# Nothing is lost. The metainfo file is still installed and still validates;
# only the pre-composed catalog XML is skipped, and Flathub regenerates that
# on its own infrastructure at publish time. Re-enable and re-test when the
# runtime's glycin can run unsandboxed, or when building on a host where the
# nested sandbox is permitted.
appstream-compose: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/forqen/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network

  # Repositories live anywhere under $HOME.
  - --filesystem=home

  # Push over SSH. Without this the agent socket is invisible inside the
  # sandbox and every SSH remote fails with a permission error that looks like
  # a credentials problem rather than a sandbox one.
  - --socket=ssh-auth

  # Token storage. forqen refuses to write tokens to disk in plaintext, so with
  # no Secret Service reachable it cannot log in at all.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-run/keyring

  # git config, global gitignore, and commit signing keys.
  - --filesystem=xdg-config/git:ro
  - --filesystem=~/.gitconfig:ro

  # GPG signing needs the agent; SSH signing goes through the socket above.
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=~/.gnupg:ro

  # See the .desktop file: glibc reads this before main() runs.
  - --env=MALLOC_ARENA_MAX=2

modules:
  # git itself is not in org.gnome.Platform, and forqen shells out to it for
  # rebase, signed commits, hooks, LFS and push negotiation. Bundling it also
  # pins the version the differential tests were written against.
  - name: git
    buildsystem: autotools
    # GNOME SDK 50 ships GCC 15, which defaults to C23. git before 2.48 has a
    # static function named `unreachable` in reflog.c, and C23 makes
    # `unreachable()` a macro in stddef.h — so those builds fail with
    # "macro 'unreachable' passed 3 arguments, but takes just 0". 2.51 renamed
    # it. `-std=gnu17` also works and is the fallback if this ever has to be
    # pinned back.
    build-options:
      cflags: -O2 -g
    make-args:
      - NO_TCLTK=1
      - NO_GETTEXT=1
    make-install-args:
      - NO_TCLTK=1
      - NO_GETTEXT=1
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.51.0.tar.xz
        # Verified against the kernel.org tarball with sha256sum on 2026-08-17.
        # If this ever mismatches, the build fails loudly — that is correct.
        # Do not "fix" a mismatch by deleting the hash.
        sha256: 60a7c2251cc2e588d5cd87bae567260617c6de0c22dca9cdbfc4c7d2b8990b62
    cleanup:
      - /libexec/git-core/git-cvs*
      - /libexec/git-core/git-svn*
      - /share/man

  - name: forqen
    buildsystem: meson
    config-opts:
      - -Dprofile=release
    # The build sandbox has no network. Without vendored crates cargo tries to
    # reach index.crates.io and dies with "Could not resolve host" — which is
    # also exactly what Flathub's builders do, so this is not optional there
    # either.
    #
    # Regenerate after any dependency change:
    #   cargo vendor --versioned-dirs vendor
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
        CARGO_HOME: /run/build/forqen/cargo
    sources:
      - type: dir
        path: ..
      # Points cargo at the vendored tree. Written into the build directory
      # rather than committed, so a normal `cargo build` outside Flatpak still
      # uses the registry and picks up updates.
      - type: file
        path: cargo-config.toml
        dest: .cargo
        dest-filename: config.toml
